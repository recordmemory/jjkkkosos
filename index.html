    var c = document.querySelector('.rows .card[data-id="' + id + '"]');
    if (c) c.scrollIntoView({ block: "start" });
  }
  function buildTEntry(e, withDate) {
    var box = el("div", "tent" + (e.k === "l" ? " lt" : ""));
    var th = el("div", "th");
    var when = (withDate ? fmtDay(e.d) + (e.tm ? " " : "") : "") + (e.tm || "");
    th.appendChild(el("span", "tm", when || (e.k === "l" ? "덧붙임" : "")));
    if (withDate) th.appendChild(el("span", "tag", e.k === "t" ? "생각" : "덧붙임"));
    var editing = e.k === "t" && tEditId === e.th.id;
    if (!editing) {
      if (e.k === "t") {
        var eb = el("button", "", "수정"); eb.type = "button";
        eb.onclick = function () { tEditId = e.th.id; render(); };
        th.appendChild(eb);
      }
      var db = el("button", "", "삭제"); db.type = "button";
      db.onclick = function () {
        if (!confirm("이 생각을 삭제할까요?")) return;
        if (e.k === "t") { thoughts = thoughts.filter(function (x) { return x !== e.th; }); persistThoughts(); }
        else { e.r.later.splice(e.idx, 1); persist(); }
        render();
      };
      th.appendChild(db);
    }
    box.appendChild(th);
    if (e.k === "l") {
      var lk = el("button", "tlink"); lk.type = "button"; lk.dataset.t = e.r.type;
      lk.appendChild(document.createTextNode("\u21B3 "));
      lk.appendChild(el("b", "", e.r.title));
      lk.appendChild(document.createTextNode(" 에 덧붙임"));
      lk.onclick = function () { gotoReview(e.r.id); };
      box.appendChild(lk);
    }
    if (editing) {
      var ed = el("div", "edit");
      var ta = el("textarea"); ta.value = e.t;
      var cb = el("div", "cb");
      var cn = el("button", "", "취소"); cn.type = "button";
      cn.onclick = function () { tEditId = null; render(); };
      var sv = el("button", "primary", "저장"); sv.type = "button";
      sv.onclick = function () {
        var v = ta.value.trim();

      };
      cb.appendChild(cn); cb.appendChild(sv);
      ed.appendChild(ta); ed.appendChild(cb);

      setTimeout(function () { ta.focus(); }, 0);

  }
  function renderTL() {
    var list = $("tlList");

      return;
    }
    var shown = ents.slice(0, tlLimit), cur = null, rows = null, counts = {};
    ents.forEach(function (e) { counts[e.d] = (counts[e.d] || 0) + 1; });
    shown.forEach(function (e) {
      if (e.d !== cur) {
        cur = e.d;
        var gh = el("div", "gh");
        gh.appendChild(el("span", "", fmtDay(e.d)));

      rows.appendChild(buildTEntry(e, false));
    });
    if (ents.length > shown.length) {
      var mb = el("button", "moreTl", "더 보기 (" + (ents.length - shown.length) + "개 남음)"); mb.type = "button";
      mb.onclick = function () { tlLimit += 60; renderTL(); };

  /* ---------- 되돌아보기 ---------- */
  function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function agoText(ds) {
    var d = new Date(ds + "T00:00:00"), t = new Date();
    var m = (t.getFullYear() - d.getFullYear()) * 12 + t.getMonth() - d.getMonth() - (t.getDate() < d.getDate() ? 1 : 0);
    return m >= 12 ? Math.floor(m / 12) + "년 전" : Math.max(1, m) + "개월 전";
  }
  function pickRecall() {
    var t = new Date();
    var limit = ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() - 30));
    var pool = data.filter(function (r) { return r.date && r.date <= limit && (r.take || r.text || r.quote); })
      .sort(function (a, b) { return a.id - b.id; });
    if (!pool.length) return null;
    var base = hashStr(today());
    var near = pool.filter(function (r) {
      var d = new Date(r.date + "T00:00:00");
      var yrs = t.getFullYear() - d.getFullYear();
      if (isNaN(d.getTime()) || yrs < 1) return false;
      return Math.abs(new Date(d.getFullYear() + yrs, d.getMonth(), d.getDate()) - t) <= 7 * 864e5;
    });
    if (recallSeed === 0 && near.length) return { r: near[base % near.length], near: true, n: pool.length };
    return { r: pool[(base + recallSeed) % pool.length], near: false, n: pool.length };
  }
  function buildRecall() {
    var pk = pickRecall();
    if (!pk) return null;
    var r = pk.r;
    var pane = el("div", "pane recall"); pane.dataset.type = r.type;
    var rh = el("div", "rh");
    rh.appendChild(el("b", "", "되돌아보기"));
    rh.appendChild(el("span", "", agoText(r.date) + (pk.near ? " 이맘때" : "")));
    pane.appendChild(rh);
    var k = el("div", "l2");
    k.appendChild(el("span", "kind", KIND[r.type].name));
    k.appendChild(el("span", "m d", r.date.replace(/-/g, ".")));
    pane.appendChild(k);
    pane.appendChild(el("div", "rt", r.title));
    if (r.take) pane.appendChild(el("div", "rx take", "\u201C" + r.take + "\u201D"));
    var body = r.text || r.quote;
    if (body) pane.appendChild(el("div", "rx", body));
    function go(add) {
      openIds[r.id] = true; infoOpen[r.id] = true; addingId = add ? r.id : null; render();
      var c = document.querySelector('.rows .card[data-id="' + r.id + '"]');
      if (c) c.scrollIntoView({ block: "start" });
    }
    var act = el("div", "actions");
    var b1 = el("button", "", "열어보기"); b1.onclick = function () { go(false); };
    var b2 = el("button", "", "생각 덧붙이기"); b2.onclick = function () { go(true); };
    act.appendChild(b1); act.appendChild(b2);
    if (pk.n > 1) {
      var b3 = el("button", "", "다른 기록"); b3.onclick = function () { recallSeed++; render(); };
      act.appendChild(b3);
    }
    pane.appendChild(act);
    return pane;
  }

  function renderList() {
    var items = getItems(true).sort(function (a, b) {
      var ra = a.status === "reading" ? 1 : 0, rb = b.status === "reading" ? 1 : 0;
      return (rb - ra) || (b.date || "").localeCompare(a.date || "") || (b.time || "").localeCompare(a.time || "") || b.id - a.id;
    });
    var list = $("list");
    list.textContent = "";
    var qv = $("q").value.trim().toLowerCase();
    var rc = (!anyFilter() && !qv) ? buildRecall() : null;
    if (rc) list.appendChild(rc);

    /* 생각 포함: 독립 생각(필터가 없을 때만) + 덧붙인 생각(보이는 후기 것만) */
    var extra = [];
    if (showTh) {
      var plain = !anyFilter();
      tlEntries(items).forEach(function (e) {
        if (e.k === "t" && !plain) return;
        if (qv && e.t.toLowerCase().indexOf(qv) < 0) return;
        extra.push(e);
      });
    }
    if (!items.length && !extra.length) {
      list.appendChild(el("div", "empty",
        !data.length ? "아직 기록이 없어요. 아래 버튼으로 첫 후기를 남겨보세요."
        : (!qv && rfilter === "no" && filter === "all" && sfilter === "all") ? "후기가 비어 있는 기록이 없어요."
        : (!qv && rfilter === "yes" && filter === "all" && sfilter === "all") ? "후기를 쓴 기록이 아직 없어요."
        : (!qv && anyFilter()) ? "조건에 맞는 기록이 없어요."
        : "검색 결과가 없어요."));
      return;
    }
    var groups = {}, order = [];
    function ens(k) { if (!groups[k]) { groups[k] = { rv: [], ex: [] }; order.push(k); } return groups[k]; }
    items.forEach(function (r) { ens(groupKey(r)).rv.push(r); });
    extra.forEach(function (e) { ens(e.d.slice(0, 7)).ex.push(e); });
    function rank(k) { return k === "reading" ? 0 : k === "none" ? 2 : 1; }
    order.sort(function (a, b) { return (rank(a) - rank(b)) || (rank(a) === 1 ? b.localeCompare(a) : 0); });
    order.forEach(function (k) {
      var g = groups[k];
      var gh = el("div", "gh");
      gh.appendChild(el("span", "", groupLabel(k)));
      gh.appendChild(el("span", "n", (g.rv.length ? String(g.rv.length) : "") + (g.ex.length ? (g.rv.length ? " · " : "") + "생각 " + g.ex.length : "")));
      list.appendChild(gh);
      var rows = el("div", "rows");
      list.appendChild(rows);
      var all = g.rv.map(function (r, i) { return { kind: 0, d: r.date || "", tm: "", i: i, r: r }; })
        .concat(g.ex.map(function (e, i) { return { kind: 1, d: e.d, tm: e.tm || "", i: i, e: e }; }));
      if (g.ex.length) all.sort(function (a, b) {
        return b.d.localeCompare(a.d) || (a.kind - b.kind) || (a.kind === 0 ? a.i - b.i : (b.tm.localeCompare(a.tm) || a.i - b.i));
      });
      all.forEach(function (x) { rows.appendChild(x.kind === 0 ? buildCard(x.r, false) : buildTEntry(x.e, true)); });
    });
  }

  /* ---------- 달력 ---------- */
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  function renderCal() {
    var allItems = getItems(false);
    var items = allItems.filter(function (r) { return r.date; });
    var byDate = {};
    items.forEach(function (r) { (byDate[r.date] = byDate[r.date] || []).push(r); });
    var tdBy = {};
    tlEntries(allItems).forEach(function (e) {
      if (e.k === "t" && anyFilter()) return;
      (tdBy[e.d] = tdBy[e.d] || []).push(e);
    });

    var prefix = calY + "-" + pad(calM + 1) + "-";
    var cnt = items.filter(function (r) { return r.date.indexOf(prefix) === 0; }).length;
    $("calTitle").textContent = calY + "년 " + (calM + 1) + "월";
    var tcnt = 0;
    Object.keys(tdBy).forEach(function (k) { if (k.indexOf(prefix) === 0) tcnt += tdBy[k].length; });
    $("calSum").textContent = (cnt ? "이 달 " + cnt + "편" : "이 달 기록 없음") + (tcnt ? " · 생각 " + tcnt : "");

    var first = (new Date(calY, calM, 1).getDay() + 6) % 7; /* 월요일 시작 */
    var days = new Date(calY, calM + 1, 0).getDate();
    var grid = $("calGrid");
    grid.textContent = "";
    for (var i = 0; i < first; i++) grid.appendChild(el("div", "day blank"));

    var todayStr = today();
    for (var d = 1; d <= days; d++) {
      (function (d) {
        var ds = prefix + pad(d);
        var dow = new Date(calY, calM, d).getDay();
        var list = byDate[ds] || [];
        var tl = tdBy[ds] || [];

                  (dow === 0 ? " sun" : dow === 6 ? " sat" : "");

        btn.type = "button";
        btn.setAttribute("aria-label", (calM + 1) + "월 " + d + "일, 기록 " + list.length + "개" + (tl.length ? ", 생각 " + tl.length + "개" : ""));
        btn.appendChild(el("span", "", String(d)));
        if (list.length || tl.length) {
          var dots = el("span", "dots");
          list.slice(0, tl.length ? 3 : 4).forEach(function (r) {
            var dot = el("i"); dot.dataset.t = r.type; dots.appendChild(dot);
          });
          if (tl.length) dots.appendChild(el("i", "td"));
          btn.appendChild(dots);
        }

        grid.appendChild(btn);
      })(d);
    }

    var sd = new Date(selDate + "T00:00:00");

    todays.forEach(function (r) { dl.appendChild(buildCard(r, true)); });
    var tbox = $("dayTh");

      tbox.appendChild(h2);

  function moveMonth(delta) {

    renderCal();
  }

  /* ---------- 통계 ---------- */
  var ORDER = ["book", "movie", "play", "musical"];
  var stat = { mode: "range", preset: "year", from: "", to: "", year: new Date().getFullYear() };

  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function presetRange(p) {
    var t = new Date(), y = t.getFullYear(), m = t.getMonth();
    if (p === "month") return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))];
    if (p === "3m") return [ymd(new Date(y, m - 3, t.getDate())), today()];
    if (p === "year") return [y + "-01-01", y + "-12-31"];
    return ["", ""];
  }
  (function () { var r = presetRange("year"); stat.from = r[0]; stat.to = r[1]; })();

  function tally(items) {
    var c = { book: 0, movie: 0, play: 0, musical: 0 };
    items.forEach(function (r) { if (c[r.type] != null) c[r.type]++; });
    return c;
  }
  function pct(n, total) { return total ? Math.round(n / total * 100) + "%" : "0%"; }
  function stackBar(c) {
    var s = el("div", "stack");
    ORDER.forEach(function (t) {

      var i = el("i"); i.dataset.t = t; i.style.flex = c[t] + " 1 0%";
      s.appendChild(i);

  }

  function matrixPane(title, first, rowDefs) {

  function navBtn(txt, label, fn) {

  function renderStats() {
    var w = $("statWrap");
    w.textContent = "";
    var dated = data.filter(function (r) { return r.date; });

    var modes = el("div", "sub");
    [["range", "기간별"], ["month", "월별"], ["year", "연도별"]].forEach(function (m) {
      var b = el("button", stat.mode === m[0] ? "on" : "", m[1]); b.type = "button";
      b.onclick = function () { stat.mode = m[0]; renderStats(); };
      modes.appendChild(b);
    });
    w.appendChild(modes);

    if (!data.length) {
      w.appendChild(el("div", "empty", "아직 기록이 없어서 통계를 낼 수 없어요."));
      return;
    }

    if (stat.mode === "range") {
      var pr = el("div", "sub");
      [["month", "이번 달"], ["3m", "최근 3개월"], ["year", "올해"], ["all", "전체"]].forEach(function (p) {
        var b = el("button", stat.preset === p[0] ? "on" : "", p[1]); b.type = "button";
        b.onclick = function () {
          var r = presetRange(p[0]); stat.preset = p[0]; stat.from = r[0]; stat.to = r[1]; renderStats();
        };
        pr.appendChild(b);
      });
      w.appendChild(pr);

      var rg = el("div", "range");
      var f = el("input"); f.type = "date"; f.value = stat.from; f.setAttribute("aria-label", "시작일");
      var t = el("input"); t.type = "date"; t.value = stat.to; t.setAttribute("aria-label", "종료일");
      f.onchange = function () { stat.from = this.value; stat.preset = null; renderStats(); };
      t.onchange = function () { stat.to = this.value; stat.preset = null; renderStats(); };
      rg.appendChild(f); rg.appendChild(el("span", "", "~")); rg.appendChild(t);
      w.appendChild(rg);

      var inR = dated.filter(function (r) {
        return (!stat.from || r.date >= stat.from) && (!stat.to || r.date <= stat.to);
      });
      w.appendChild(summaryPane(inR, "선택한 기간"));
      var mk = {};
      inR.forEach(function (r) { mk[r.date.slice(0, 7)] = 1; });
      var mkeys = Object.keys(mk).sort();
