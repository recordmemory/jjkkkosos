<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f4f8">
<title>나의 후기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #f3f4f8;
    --paper: #ffffff;
    --ink: #191c2b;
    --sub: #6b7086;
    --mute: #a0a4b6;
    --line: #e5e7f0;
    --line2: #d5d8e4;
    --book: #e8b400;
    --movie: #c8443b;
    --show: #6b46b8;
    --musical: #ee5fa0;
  --think: #5b6dd6;
    --star: #e3a11c;
    --sun: #cf5048;
    --sat: #4468b0;
    --sans: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --serif: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
  }
  /* 카테고리 고유 색: 탭, 입력창 버튼, 달력 점, 목록, 통계가 모두 같은 색을 씀 */
  [data-k="book"], [data-f="book"], [data-type="book"], [data-t="book"] { --c: var(--book); --cf: #4a3500; --ct: #b08700; }
  [data-k="movie"], [data-f="movie"], [data-type="movie"], [data-t="movie"] { --c: var(--movie); --cf: #fff; --ct: var(--movie); }
  [data-k="play"], [data-f="play"], [data-type="play"], [data-t="play"] { --c: var(--show); --cf: #fff; --ct: var(--show); }
  [data-k="musical"], [data-f="musical"], [data-type="musical"], [data-t="musical"] { --c: var(--musical); --cf: #fff; --ct: var(--musical); }
  [data-k="think"], [data-f="think"], [data-type="think"], [data-t="think"] { --c: var(--think); --cf: #fff; --ct: var(--think); }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.5; padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  button { font-family: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; }

  /* 헤더 */
  header { padding-top: env(safe-area-inset-top); }
  .hrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 34px 16px 16px; }
  header h1 { margin: 0; font-family: var(--serif); font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }
  header p { margin: 7px 0 0; color: var(--sub); font-size: 13.5px; }
  .ghost {
    display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px;
    border: 1px solid var(--line2); background: var(--paper); color: var(--ink);
    border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .ghost svg { flex: none; }

  /* 상단 도구 */
  .tools { position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .views { display: flex; background: #e7e9f1; border-radius: 10px; padding: 2px; margin-bottom: 6px; }
  .views button {
    flex: 1; border: 0; background: transparent; height: 28px; border-radius: 8px;
    font-size: 14px; color: var(--sub); cursor: pointer;
  }
  .views button.on { background: var(--paper); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(25,28,43,.12); }

  .tabs { display: flex; gap: 5px; margin-bottom: 6px; }
  .tabs button {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px;
    height: 28px; padding: 0 2px; border: 1.5px solid var(--c, var(--ink)); background: var(--paper);
    color: var(--ink); border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .tabs button.on { background: var(--c, var(--ink)); color: var(--cf, #fff); font-weight: 700; }
  .tabs button[data-f]:not([data-f="all"])::before,
  .kinds button[data-k]::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none;
  }
  .tabs button.on::before, .kinds button.on::before { background: var(--cf, #fff) !important; }

  .rtabs { margin-bottom: 6px; gap: 5px; }
  .rtabs button { height: 26px; font-size: 12.5px; }
  .rtabs .sbtn {
    flex: none; width: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    background: #dcdfe9; border-color: #dcdfe9; color: #5b6076;
  }
  .rtabs .sbtn.act { background: #6b7086; border-color: #6b7086; color: #fff; }
  #qbox { margin-bottom: 2px; }

  input[type=search], input[type=text], input[type=date], textarea, select {
    width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 12px; padding: 11px 12px; font-size: 16px; font-family: inherit;
  }
  input[type=search] { padding: 6px 12px; line-height: 1.2; border-radius: 10px; -webkit-appearance: none; appearance: none; }
  textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
  :focus-visible { outline: 3px solid #7d8bff; outline-offset: 1px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; }

  /* 목록 */
  #list { padding: 2px 16px; }
  .gh { display: flex; align-items: baseline; gap: 6px; margin: 16px 4px 7px; font-size: 13px; font-weight: 700; color: var(--sub); }
  .gh .n { font-weight: 500; color: var(--mute); }
  .rows { background: var(--paper); border-radius: 14px; overflow: hidden; overflow: clip; box-shadow: 0 0 0 1px var(--line); }
  .card { position: relative; padding: 10px 14px 10px 20px; cursor: pointer; }
  .card + .card { border-top: 1px solid var(--line2); }
  /* 새로 추가한 카드: 카드 색이 연하게 두 번 숨 쉬듯 번졌다 사라짐 */
  .card.newflash::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: var(--c); opacity: 0;
    animation: cardglow 1.9s ease-in-out both;
  }
  @keyframes cardglow {
    0%   { opacity: 0; }
    22%  { opacity: .15; }
    45%  { opacity: .03; }
    68%  { opacity: .11; }
    100% { opacity: 0; }
  }
  .card:active { background: #f7f8fb; }
  .card .bar { position: absolute; left: 9px; top: 11px; bottom: 11px; width: 3px; border-radius: 2px; background: var(--c); z-index: 3; }   /* 층 순서(아래→위): 버튼 줄 1 < 제목 줄 2 < 색 띠 3 < PDF 선택 바 4 < 상단 도구 5 */
  /* 예정(아직 안 본) 기록: 띠·종류 글자·D-day 마크가 같은 진하기(--soft) */
  :root { --soft: .55; }
  .card .bar.soft { opacity: var(--soft); }
  .l2 .kind.soft { opacity: var(--soft); }
  .l1 { display: flex; align-items: baseline; gap: 8px; }
  .card h2 {
    flex: 1; min-width: 0; margin: 0; font-family: var(--serif); font-size: 15.5px; font-weight: 600;
    line-height: 1.4; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card.open h2 { white-space: normal; overflow: visible; }
  .stars { flex: none; color: var(--star); font-size: 11px; letter-spacing: 1px; }
  .stars i { color: var(--line2); font-style: normal; }
  .rvic { flex: none; align-self: center; width: 14px; height: 14px; color: var(--ct, var(--c)); fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; opacity: .35; }
  .rvic.has { fill: currentColor; opacity: 1; }
  .rvic.btn { cursor: pointer; box-sizing: content-box; padding: 6px; margin: -6px; -webkit-tap-highlight-color: transparent; }
  .rvic.btn:active { opacity: .7; }
  .l2 { display: flex; align-items: center; margin-top: 1px; font-size: 12.5px; color: var(--sub); white-space: nowrap; min-width: 0; }
  .l2 .kind { flex: none; color: var(--ct, var(--c)); font-weight: 700; }
  .l2 .m { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .l2 .m.d { flex: none; }
  .l2 .m::before {
    content: ""; display: inline-block; width: 1px; height: 9px; background: var(--line2);
    margin: 0 7px; vertical-align: -1px;
  }
  .badge {
    flex: none; margin-left: 6px; background: rgba(232,180,0,.15); color: #8a6a00; border-radius: 4px;
    padding: 0 5px; font-size: 10.5px; font-weight: 500; line-height: 16px;
  }
  .badge.dday { background: transparent; box-shadow: inset 0 0 0 1px currentColor; color: var(--ct, #8a6a00); font-weight: 600; opacity: var(--soft); }
  .badge.dday.today { opacity: 1; }
  .subin, .wsub { display: block; width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--line2); background: transparent; font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); padding: 8px 2px; margin: 0 0 6px; outline: none; }
  .subin[hidden], .wsub[hidden] { display: none; }
  .wsub { margin: 4px 16px 0; width: calc(100% - 32px); }
  .subin::placeholder, .wsub::placeholder { font-weight: 400; color: var(--mute); }
  .entHint { font-size: 11.5px; color: var(--mute); }
  #cardEntries .thead { display: flex; justify-content: space-between; align-items: baseline; }
  .entitem { display: block; width: 100%; text-align: left; border: 0; border-top: 1px dashed var(--line2); background: none; padding: 11px 0; margin: 0; font: inherit; color: inherit; cursor: pointer; }
  .entitem:first-child { border-top: 0; }
  .entitem:active { opacity: .6; }
  .entitem .em { font-size: 11.5px; color: var(--mute); }
  .entitem .esub { font-size: 14px; font-weight: 700; margin-top: 3px; }
  .entitem .et { margin-top: 3px; font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
  .entempty { padding: 6px 0; font-size: 13px; color: var(--mute); }
  .esub { font-size: 14px; font-weight: 700; margin-top: 3px; overflow-wrap: anywhere; }
  .card.open .esub + .text { margin-top: 3px; }
  .rvstick .tkact { position: absolute; right: 0; top: -2px; display: flex; gap: 12px; background: var(--paper); }
  .rvstick .tkact button { margin: 0; padding: 2px 0; border: 0; background: none; font: inherit; font-size: 12.5px; line-height: 20px; color: var(--sub); cursor: pointer; white-space: nowrap; }
  .rvstick .tkact button:active { opacity: .6; }
  .rvwrap.tkent .rmrow { padding-right: 90px; }
  .card.open .rvwrap.tkent + .rvwrap.tkent { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line2); }
  .card.open .detail > .rvwrap.tkent:first-child { margin-top: 14px; }
  .badge.tkb { background: transparent; box-shadow: inset 0 0 0 1px currentColor; color: var(--think); font-weight: 600; }
  .tkk { margin-bottom: 10px; }
  #tkfsel[hidden], #tpfsel[hidden] { display: none; }
  .badge.paused { background: rgba(120,126,150,.14); color: #6b7088; }
  .badge.stale { background: rgba(207,80,72,.10); color: #b0453d; }
  .badge.read { background: transparent; box-shadow: inset 0 0 0 1px rgba(232,180,0,.6); color: #8a6a00; }
  .lastlog { margin-top: 5px; font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lastlog b { font-weight: 600; color: var(--mute); margin-right: 6px; font-size: 12px; }
  .qs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line2); }
  .qs button {
    height: 28px; padding: 0 13px; border: 1px solid var(--line2); background: var(--paper); border-radius: 999px;
    font-size: 13px; color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .qs button.main { background: var(--book); border-color: var(--book); color: #4a3500; font-weight: 700; }
  .gh.fold { cursor: pointer; user-select: none; }
  .gh.fold .chev { margin-left: auto; font-size: 11px; color: var(--mute); }
  .detail { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .cast { font-size: 13.5px; color: var(--ink); margin-top: 3px; }
  .cast b { color: var(--sub); font-weight: 600; margin-right: 6px; }
  .note { margin-top: 3px; font-size: 13.5px; color: var(--sub); overflow-wrap: anywhere; }
  .text { margin-top: 8px; white-space: pre-wrap; font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
  .actions { display: flex; margin-top: 10px; }
  .actions button {
    border: 1px solid var(--line2); background: var(--paper); border-radius: 8px;
    padding: 6px 13px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .actions .del { color: var(--movie); }

  /* 펼친 카드: 제목 한 줄 + 버튼 줄만 고정, 세부정보·후기는 함께 스크롤 */
  :root { --headh: 41px; }
  .card { scroll-margin-top: calc(var(--toolh, 0px) + 6px); }
  .card.open { cursor: default; }
  .card.open:active { background: transparent; }
  .chead {
    position: sticky; top: var(--toolh, 0px); z-index: 2; background: var(--paper);
    margin: -10px -14px 0 -20px; padding: 0 14px 0 20px; height: var(--headh);
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .hl { display: flex; align-items: center; gap: 8px; height: 40px; }
  .hl .kind.soft { opacity: var(--soft); }
  .hl .kind { flex: none; color: var(--ct, var(--c)); font-weight: 700; font-size: 12.5px; }
  .hl .ht {
    flex: 1; min-width: 0; font-family: var(--serif); font-size: 14.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hl .hd { flex: none; font-size: 12px; color: var(--sub); white-space: nowrap; }
  .cinfo { padding: 8px 0 10px; cursor: default; }
  .cinfo .frow { display: flex; align-items: baseline; gap: 8px; }
  .cinfo .ftitle { flex: 1; min-width: 0; font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  .cinfo .tk { display: block; margin-top: 6px; }
  .cinfo .tk .tt { white-space: normal; overflow: visible; text-overflow: clip; }
  .abar {
    position: sticky; top: calc(var(--toolh, 0px) + var(--headh)); z-index: 1; background: var(--paper);
    display: flex; align-items: center;
    margin: 0 -14px 0 -20px; padding: 6px 14px 6px 20px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .abar button {
    height: 28px; border: 1px solid var(--line2); background: var(--paper); border-radius: 8px;
    padding: 0 10px; font-size: 13px; cursor: pointer; color: var(--ink); white-space: nowrap;
  }
  .abar .tog { border-radius: 999px; }
  .abar .tog:disabled { opacity: .35; cursor: default; }
  .abar .del { color: var(--movie); margin-left: auto; }
  .card.open .detail { border-top: 0; margin-top: 0; padding-top: 0; padding-bottom: 4px; }
  .card.open .text { margin-top: 12px; }
  .rmeta { margin-top: 6px; font-size: 11.5px; color: var(--mute); }
  .rvwrap { position: relative; margin-top: 6px; }
  .rmrow { min-height: 20px; padding-right: 64px; }
  .rmrow .rmeta { margin: 0; line-height: 1.75; min-width: 0; }
  .rmrow .rmeta .rmedit { padding: 0; line-height: inherit; }
  /* 「후기 수정」: 날짜 줄 오른쪽 제자리에 고정(스크롤을 따라오지 않음) */
  .rvstick { position: relative; height: 0; }
  .rvstick .rmwr {
    position: absolute; right: 0; top: -2px; margin: 0; padding: 2px 0 2px 6px; border: 0; border-radius: 6px;   /* 오른쪽 끝 글자를 「접기/펼치기」와 같은 선에 */
    background: var(--paper); font: inherit; font-size: 12.5px; line-height: 20px; color: var(--sub); cursor: pointer; white-space: nowrap;
  }
  .rvstick .rmwr:active { opacity: .6; }
  .card.open .rmrow + .text { margin-top: 0; }
  .card.open .later.rlog + .rvwrap { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line2); }
  .rmeta .rmedit { border: 0; background: none; padding: 2px 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .rmeta .rmedit:active { opacity: .6; }
  .empty { text-align: center; color: var(--sub); padding: 56px 20px; font-size: 14px; }
  .empty.small { padding: 14px 0 6px; }

  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: rgba(243,244,248,.96); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); padding: 5px 16px calc(5px + env(safe-area-inset-bottom));
  }
  #dock .in { max-width: 608px; margin: 0 auto; display: flex; }
  #dock button {
    border: 1px solid var(--line2); background: var(--paper);
    color: var(--ink); cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; justify-content: center;
  }
  #dock .dclose { flex: 1 1 0; min-width: 0; }
  #dock .dclose:disabled { opacity: .4; cursor: default; }
  #dock .dadd { flex: 2 1 0; min-width: 0; background: var(--ink); border-color: var(--ink); color: #fff; }
  #dock .dtop { flex: none; padding: 0; }

  /* 달력 */
  .calhead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .calhead button {
    height: 38px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px;
    font-size: 14px; color: var(--ink); cursor: pointer;
  }
  .calhead .navb { width: 38px; }
  .calhead button:disabled { opacity: .3; cursor: default; }
  /* 확인창: 앱 전체와 같은 Pretendard + 남색 잉크 톤, 제목은 헤더처럼 명조. 기록 카드·아이콘만 카테고리 색을 입음. 위험한 동작만 붉은색 */
  .dlg { --dg: #d8453b; --dg-d: #b3332a; --dg-s: #fdeceb; position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; background: rgba(25,28,43,.46); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; transition: opacity .22s; font-family: var(--sans); }
  .dlg.show { opacity: 1; }
  .dlg .dsheet { position: relative; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 30px 30px 0 0; padding: 30px 22px calc(16px + env(safe-area-inset-bottom)); transform: translateY(44px); transition: transform .34s cubic-bezier(.2,.9,.25,1); box-shadow: 0 -12px 44px rgba(25,28,43,.2); }
  .dlg .dsheet::before { content: ""; position: absolute; top: 9px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--line2); }
  .dlg.show .dsheet { transform: none; }
  .dlg .dic { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #eceef6; color: var(--ink); margin-bottom: 14px; }
  .dlg .dic svg { width: 22px; height: 22px; }
  .dlg .dsheet[data-t] .dic { background: color-mix(in srgb, var(--c) 15%, #fff); color: var(--ct); }
  .dlg.danger .dic { background: var(--dg-s); color: var(--dg); }
  .dlg .dt { font-family: var(--serif); font-size: 20px; font-weight: 700; line-height: 1.42; letter-spacing: -.035em; word-break: keep-all; overflow-wrap: anywhere; }
  .dlg .dtarget { margin-top: 16px; padding: 13px 15px 13px 18px; border-radius: 16px; background: var(--bg); box-shadow: inset 4px 0 0 var(--c, var(--line2)); font-size: 16px; font-weight: 650; line-height: 1.5; letter-spacing: -.025em; word-break: keep-all; overflow-wrap: anywhere; }
  .dlg .dtx { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .dlg .dcat { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 15%, #fff); color: var(--ct, var(--ink)); font-size: 13px; font-weight: 700; line-height: 22px; letter-spacing: -.02em; vertical-align: 1px; }
  .dlg .dm { margin-top: 12px; font-size: 15px; line-height: 1.65; letter-spacing: -.02em; color: var(--sub); white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }
  .dlg .dtarget + .dm { margin-top: 14px; }
  .dlg .dmeta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .dlg .dmeta > span { display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--sub); font-size: 12.5px; font-weight: 500; line-height: 1.35; letter-spacing: -.02em; }
  .dlg .dmeta svg { flex: none; width: 13px; height: 13px; }

  .lh.fold { display: flex; align-items: center; gap: 6px; width: 100%; padding: 2px 0; border: 0; background: none; font-family: inherit; text-align: left; cursor: pointer; }
  .lh.fold .fc { font-weight: 500; color: var(--mute); }
  .lh.fold .chev { margin-left: auto; display: inline-flex; align-items: center; color: var(--sub); }
  .lh.fold.folded { margin-bottom: 0; }
  .li { margin-bottom: 9px; }
  .ld { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--mute); }
  .ld button { border: 0; background: none; color: var(--mute); font-size: 12px; cursor: pointer; padding: 0 2px; }
  .ld .lbw { display: flex; gap: 8px; }
  .ld .rmedit { padding: 0; text-align: left; font: inherit; }
  .lx { font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
  .compose { margin-top: 8px; }
  /* 후기 읽던 화면 그대로, 아래에 뜨는 입력창. 투명 틀이 보이는 화면(자판 위)을 따라다니고 입력창은 그 맨 아래에 붙음 */
  .tdockwrap { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 40; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
  .tdock {
    pointer-events: auto; width: 100%; max-width: 640px;
    background: var(--paper); border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 24px rgba(25,28,43,.13), 0 0 0 1px var(--line);
    padding: 11px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .tdock.kb { padding-bottom: 10px; }
  .tdock .tdh { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; }
  .tdock .tdh b { flex: none; color: var(--ct, var(--ink)); }
  .tdock .tdh span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tdock .compose { margin-top: 7px; }
  .tdock .compose textarea { min-height: 52px; max-height: 30vh; }
  .compose textarea { min-height: 88px; font-size: 15px; padding: 10px 12px; }
  .cb { display: flex; margin-top: 6px; justify-content: flex-end; }
  .cb button {
    border: 1px solid var(--line2); background: var(--paper); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .cb .primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }

  /* 댓글 입력칸: 카드 안에 자연스럽게 녹아드는 연한 회색 칸. 누르면 하얗게 바뀌며 카테고리 색 테두리가 생김 */
  .compose { margin-top: 8px; padding: 9px 12px 7px; background: #f4f5f9; border-radius: 14px; box-shadow: inset 0 0 0 1.5px transparent; transition: background .15s, box-shadow .15s; }
  .compose:focus-within { background: #fff; box-shadow: inset 0 0 0 1.5px var(--c, var(--line2)); }
  .compose textarea { display: block; width: 100%; min-height: 48px; max-height: 240px; padding: 0; border: 0; border-radius: 0; background: transparent; font-size: 16px; line-height: 1.6; resize: none; overflow-y: auto; }
  .compose textarea::placeholder { color: var(--mute); }
  .compose textarea:focus, .compose textarea:focus-visible { outline: none; }
  .compose .cb { margin-top: 4px; gap: 4px; align-items: center; }
  .compose .cb button { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; }
  .compose .cb button:not(.primary) { border-color: transparent; background: transparent; color: var(--sub); font-weight: 500; }
  .compose .cb .primary { padding: 0 16px; transition: opacity .15s; }
  .compose.empty .cb .primary { opacity: .3; }
  /* 목록 안에서 감상·생각을 고치는 동안(자판이 올라온 동안): 아래 여백을 늘려 입력칸을 자판 위로 올릴 수 있게 하고, 하단 버튼 줄은 잠깐 숨김 */
  body.kbup { padding-bottom: calc(55vh + env(safe-area-inset-bottom)); }
  body.kbup #dock { display: none; }

  .recall { margin-top: 12px; }
  .recall .rh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 13px; }
  .recall .rh b { color: var(--sub); }
  .recall .rh span { color: var(--mute); }
  .recall .rt { margin-top: 2px; font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.4; }
  .recall .rx {
    margin-top: 6px; font-size: 14px; line-height: 1.65; color: #3a3f55; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .recall .rx.take { font-weight: 600; color: var(--ink); }

  #quote { min-height: 84px; font-size: 15px; line-height: 1.65; }
  #writer #rateBox {
    flex: none; display: flex; align-items: center; padding: 2px 14px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  #writer #rateBox label { margin: 0; }
  #writer #rateBox { gap: 6px; }
  /* 작성 창 맨 위 고정 탭: 작게 */
  #writer .vtabs { flex: none; }
  /* 관람 후(별점 + 가이드 질문)와 관람 전(가이드 질문) 줄을 같은 높이·같은 선으로 */
  #writer #rateBox, #writer #wPreBox { box-sizing: border-box; border-bottom: 1px solid var(--line); background: var(--bg); }
  #writer #wPreBox { flex: none; display: flex; align-items: center; justify-content: flex-end; }
  #writer #wPreBox[hidden] { display: none; }
  #writer #wPreBox .gbtn { margin-left: auto; flex: none; height: 28px; padding: 0 10px; }
  #rateBox #gOpen2 { display: none; }
  #writer #rateBox #gOpen2 { display: inline-flex; margin-left: auto; flex: none; height: 28px; padding: 0 10px; }


  /* ===== 디자인 개선: 헤더 2×2 버튼 / 필터 / 달력 ===== */
  .hact { flex: none; }
  .hact .ghost {
    height: 32px; padding: 0 12px; justify-content: center; gap: 5px; white-space: nowrap;
    text-decoration: none; font-size: 12.5px; font-weight: 500; box-shadow: 0 1px 2px rgba(25,28,43,.05);
  }
  .hact .ghost:active { background: #eef0f7; }
  #adminLink { color: var(--ink); }

  .tools { box-shadow: 0 1px 0 var(--line); }
  .tools .views { background: #e4e7f0; }
  .tools .views button { font-weight: 500; transition: background .15s, color .15s; }
  .tools .views button.on { box-shadow: 0 1px 3px rgba(25,28,43,.14); }

  .tools .tabs button {
    border: 1px solid var(--line2); border-radius: 999px; font-weight: 500;
    background: var(--paper); color: var(--ink); transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  .tools .tabs button.on {
    background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: var(--cf, #fff); font-weight: 700;
  }

  #rtabs { margin-bottom: 0; }
  #rtabs button {
    flex: none; border: 0; border-radius: 0; background: transparent;
    color: var(--mute); font-weight: 500; position: relative;
  }
  #rtabs button.on { background: transparent; color: var(--ink); font-weight: 700; }
  #rtabs button[data-r].on::after {
    content: ""; position: absolute; height: 2px; border-radius: 2px; background: var(--ink);
  }
  #rtabs .sbtn {
    flex: none; padding: 0; border-radius: 50%;
    background: var(--paper); border: 1px solid var(--line2); color: var(--sub);
  }
  #rtabs .sbtn.act { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* 달력 */
  #calWrap { padding: 12px 16px 4px; }
  .calcard { background: var(--paper); border-radius: 20px; box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(25,28,43,.05); padding: 14px 10px 10px; }
  .calcard .calhead { margin: 0 4px 10px; }
  .calcard .caltitle { flex: 1; text-align: left; font-size: 21px; letter-spacing: -0.02em; }
  .calcard .caltitle small { margin-top: 1px; font-size: 12.5px; }
  .calcard .calhead button { border: 1px solid var(--line); background: var(--paper); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .calcard .calhead .todayb { width: auto; border-radius: 999px; font-size: 13px; }
  .calcard .calhead button:active { background: #eef0f7; }
  .calcard .dow { gap: 0; margin-bottom: 2px; }
  .calcard .dow div { font-size: 11.5px; font-weight: 600; padding: 6px 0; }
  .calcard #calGrid { gap: 2px 0; }
  .calcard .day {
    height: 54px; background: transparent; border: 0; border-radius: 12px; padding: 4px 0 0; gap: 3px; font-size: 14px;
  }
  .calcard .day > span:first-child {
    width: 31px; height: 31px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; transition: background .12s;
  }
  .calcard .day.today { border: 0; }
  .calcard .day.today > span:first-child { font-weight: 800; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .calcard .day.sel { background: transparent; color: inherit; }
  .calcard .day.sel > span:first-child { background: var(--ink); color: #fff; font-weight: 700; box-shadow: none; }
  .calcard .day.sel .dots i { box-shadow: none; }
  .calcard .day.blank { background: transparent; }
  .calcard .dots { min-height: 6px; }
  .calcard .day:not(.blank):not(.sel):active > span:first-child { background: #eef0f7; }

  .dayhead { margin: 18px 4px 8px; font-size: 16px; }
  .dayhead button { background: var(--ink); border-color: var(--ink); color: #fff; }

  #toast {
    position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px);
    background: rgba(25,28,43,.92); color: #fff; font-size: 13.5px; padding: 10px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* 상단 안내: 알약 모양 상자에 흰 글자, 천천히 떴다가(페이드인) 사라짐(페이드아웃) */
  #topHint {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 14px); z-index: 60;
    max-width: calc(100% - 32px); width: max-content; text-align: center;
    background: rgba(25,28,43,.6); color: #fff; font-size: 12.5px; line-height: 1.4; padding: 10px 18px 8px;   /* 한글 글꼴이 위로 쏠려 보여서 위 여백을 2px 더 줌 */
    display: flex; align-items: center; justify-content: center; border-radius: 999px;
    opacity: 0; transform: translate(-50%, -8px); pointer-events: none;
    transition: opacity .45s ease, transform .45s ease;
  }
  #topHint.show { opacity: 1; transform: translate(-50%, 0); }
  .gpane .phead { align-items: center; }
  .gpane .phead > button { border: 1px solid var(--line2); background: var(--paper); border-radius: 999px; font-size: 12.5px; padding: 4px 12px; color: var(--ink); cursor: pointer; font-family: inherit; }
  .gnums { display: flex; align-items: baseline; gap: 6px; }
  .gnums b { font-family: var(--serif); font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
  .gnums span { color: var(--sub); font-size: 14px; }
  .gnums em { margin-left: auto; font-style: normal; font-weight: 700; color: var(--ct); }
  .gtrack { position: relative; display: block; height: 10px; border-radius: 5px; background: var(--line); margin: 8px 0 11px; }
  .gtrack i { position: relative; z-index: 1; display: block; height: 100%; border-radius: 5px; background: var(--c); }
  /* 읽는 중: 완독 바 뒤에 깔리는 빗금 알약(완독 바가 그 위에 겹쳐 둥글게 끝남) */
  .gtrack s { position: absolute; left: 0; top: 0; bottom: 0; z-index: 0; border-radius: 5px; text-decoration: none;
    background: repeating-linear-gradient(135deg, var(--c) 0 1.5px, transparent 1.5px 4px); }
  .gtrack u { z-index: 2; position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .5; border-radius: 1px; text-decoration: none; }
  .gnote { font-size: 13.5px; color: var(--sub); margin-top: 3px; }
  .gnote.hi { color: var(--ink); font-weight: 700; }
  .gline { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 3px; }
  .gline.end { justify-content: flex-end; margin-top: 8px; }
  .gline .gnote { margin-top: 0; }
  .gline.fx { flex-wrap: nowrap; }   /* 고정 버튼이 아래 줄로 떨어져 높이가 변하지 않게 */
  .gline.fx .gnote { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 20px; }
  .gline.ph { visibility: hidden; }   /* 다른 해에서도 「읽는 중」 줄 높이만 남겨 카드 높이를 같게 */
  .gpin { display: flex; margin-left: auto; }
  .gpin button {
    flex: none; height: 26px; padding: 0; border: 0; border-radius: 0; background: transparent;
    color: var(--mute); font-family: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .gpin button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
  .gpin button.on { color: var(--ink); font-weight: 700; }
  .gpin button.on::before { background: var(--ink); box-shadow: none; }
  .mright { display: flex; align-items: center; gap: 8px; }
  .mbulk { border: 1px solid var(--line2); background: var(--paper); border-radius: 999px; font-size: 12px; padding: 2px 10px; color: var(--sub); cursor: pointer; font-family: inherit; }
  .mbulk.flat { border-width: 0; padding: 2px 0; background: transparent; cursor: default; pointer-events: none; -webkit-tap-highlight-color: transparent; }
  .mbulk.on { color: var(--ink); border-color: var(--ink); }
  .gedit { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .gedit input { width: 84px; padding: 8px 10px; text-align: center; }
  .gedit input:focus, .gedit input:focus-visible { outline: none; border-color: var(--line2); }
  .gedit button { border: 1px solid var(--line2); background: var(--paper); border-radius: 999px; font-size: 13px; padding: 7px 14px; color: var(--ink); cursor: pointer; font-family: inherit; }
  .gedit button.primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
  .gedit button.dim { border-color: transparent; color: var(--sub); }
  .gmini { display: flex; align-items: center; gap: 10px; width: 100%; margin: 0 0 8px; padding: 9px 14px; background: var(--paper); border: 0; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); font: inherit; font-size: 13px; color: var(--sub); cursor: pointer; text-align: left; }
  .gmini .gtrack { flex: 1; margin: 0; height: 7px; }
  .gmini b { color: var(--ink); white-space: nowrap; }
  .gmini.none b { color: var(--mute); font-weight: 400; }
  .gx .gxbox { margin: 0 0 8px; }
  .gxbox .gnote { line-height: 20px; min-height: 20px; }   /* 빈 줄도 글자 있는 줄과 같은 높이 */
  .gxbox .gnote.ph { visibility: hidden; }
  #list > .gx:first-child { margin-top: 10px; }   /* 달력(#calWrap 위 여백 12px)과 맞춤 */
  .gx .gxbox .phead { align-items: center; min-height: 30px; }   /* 버튼을 줄여도 제목 줄 높이는 그대로 */
  /* 알약 54×24. 동그라미(24×18)와 글자 칸 두 개가 "같은 상자"(24×18)라서 글자가 동그라미 정중앙에 올 수밖에 없는 구조.
     바깥 여백은 위·아래·좌·우 모두 3px. 버튼 안을 grid/flex로 짜면 기기에 따라 틀어져서 좌표로 직접 배치 */
  .gmode { position: relative; flex: none; display: block; box-sizing: border-box; width: 54px; height: 24px; padding: 0; border: 0; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); font: inherit; font-size: 12px; line-height: 1; letter-spacing: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .gmode .gthumb { position: absolute; top: 3px; left: 3px; width: 24px; height: 18px; border-radius: 999px; background: var(--ink); transition: left .18s ease; }
  .gmode.m .gthumb { left: 27px; }
  .gmode span { position: absolute; top: 3px; z-index: 1; width: 24px; height: 18px; display: flex; align-items: center; justify-content: center; line-height: 1; white-space: nowrap; color: var(--sub); transition: color .18s; }
  .gmode span:nth-of-type(1) { left: 3px; }
  .gmode span:nth-of-type(2) { left: 27px; }
  .gmode span.on { color: #fff; font-weight: 700; }
  .rlist .phead { align-items: center; }
  .rlg { display: inline-flex; gap: 8px; font-size: 11.5px; color: var(--sub); }
  .rlg span { display: inline-flex; align-items: center; gap: 3px; }
  .rlg i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .rrow { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .rrow b { font-weight: 700; }
  .rrow span { text-align: right; color: var(--sub); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .rrow .stack { height: 8px; }
  .rrow.zero b, .rrow.zero span { color: var(--mute); font-weight: 400; }
  #statWrap .rows { margin-bottom: 12px; }
  .gprows .prow { padding-left: 0; padding-right: 0; }
  .gprows .phead + .prow { padding-top: 0; }
  .gprows .prow:last-child { padding-bottom: 0; }   /* 아래도 카드 안쪽 여백(14px)만 남김 */   /* 제목 아래 간격은 .phead의 10px만 (다른 카드와 동일) */   /* 통계 카드 사이 간격을 .pane과 같게 */
  .gxhid { text-align: right; margin: 0 0 6px; }
  .gxhid button { border: 0; background: none; color: var(--mute); font: inherit; font-size: 12px; padding: 2px 4px; cursor: pointer; text-decoration: underline; }
  .gbtns, .recall .actions { display: flex; gap: 6px; }
  /* 독서 목표 카드: 버튼은 카드 안에 띄워서(absolute) 마지막 문구 줄 오른쪽 끝에 둠 → 버튼 때문에 카드 높이가 늘지 않음 */
  .gxbox { position: relative; }
  .gxbox > .gbtns { position: absolute; right: 16px; bottom: 14px; margin: 0; }
  .recall .actions { margin-top: 9px; }
  .gbtns button, .recall .actions button {
    display: inline-flex; align-items: center; justify-content: center; height: 26px; padding: 0 12px;
    border: 1px solid var(--line2); background: var(--paper); border-radius: 999px;
    font-size: 12.5px; font-weight: 400; line-height: 1; color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .gbtns .rhide, .recall .actions .rhide { margin-left: auto; }
  /* 목표 탭: 월별 목표 목록 + 비교 그래프 */
  .mrow { display: grid; grid-template-columns: 30px 1fr 70px 50px; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .mrow .ml { font-size: 14px; font-weight: 600; }
  .mrow.now .ml { color: var(--ct); }
  .mrow .gtrack { margin: 0; height: 8px; }
  .mrow b { font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mrow b.ok { color: var(--ct); }
  .mrow b.none { color: var(--mute); font-weight: 400; }
  .mrow button { border: 1px solid var(--line2); background: var(--paper); border-radius: 999px; font-size: 12px; padding: 4px 0; color: var(--ink); cursor: pointer; font-family: inherit; }
  .mpane .gedit { margin: 0 0 8px 40px; }
  .gleg { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--sub); }
  .gleg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--line2); }
  .gleg i.d { background: var(--c); }
  .gleg > span, .gchart .gcol { cursor: pointer; transition: opacity .15s; }
  .gleg > span.hsel { color: var(--ink); font-weight: 700; }
  .gbars i, .gcol .gl { transition: opacity .15s; }
  .gchart { display: flex; gap: 3px; padding-top: 16px; }
  .gchart.sc { overflow-x: auto; }
  .gcol { flex: 1; min-width: 0; align-items: center; }
  .gchart.sc .gcol { min-width: 46px; }
  .gbars { width: 100%; height: 120px; display: flex; align-items: flex-end; justify-content: center; gap: 2px; border-bottom: 1px solid var(--line2); }
  .gbars i { position: relative; flex: 1; max-width: 16px; border-radius: 3px 3px 0 0; background: var(--line2); }

  #toast.act button { border: 0; background: rgba(255,255,255,.14); color: #ffd45a; font-size: 13.5px; font-weight: 700; letter-spacing: -.02em; padding: 8px 12px; border-radius: 11px; cursor: pointer; transition: background .15s; }
  #toast.act button:active { background: rgba(255,255,255,.24); }

  /* ===== 헤더 버튼 재정리: 위줄=수정·관리자(희미한 텍스트) / 아랫줄=불러오기·백업(작은 버튼) ===== */
  .hact { justify-items: end; }
  .hact #editBtn { order: 1; } .hact #adminLink { order: 2; }
  .hact #import { order: 3; } .hact #export { order: 4; }

  .hact #editBtn, .hact #adminLink {
    height: auto; padding: 2px 0; border: 0; border-radius: 0; background: transparent; box-shadow: none;
    color: var(--mute); font-weight: 400; gap: 4px;
  }
  .hact #editBtn svg, .hact #adminLink svg { width: 12px; height: 12px; stroke-width: 2; }
  .hact #editBtn:active, .hact #adminLink:active { background: transparent; color: var(--ink); }

  .hact #import, .hact #export {
    box-shadow: none;
    border: 1px solid var(--line2); background: var(--paper); color: var(--sub);
  }
  .hact #import:active, .hact #export:active { background: #eef0f7; }

  /* ===== 보정: 버튼 간격 좁히기 + 고정 영역 컴팩트하게 ===== */
  .hact { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; grid-template-columns: none; }
  .hact .hline { display: flex; align-items: center; }
  .hact .hl-a { gap: 12px; }

  .tools { padding: 4px 16px 6px; }

  .tools .views button { height: 26px; border-radius: 8px; font-size: 13.5px; }
  .tools .tabs { gap: 5px; margin-bottom: 4px; }
  .tools .tabs button { height: 28px; font-size: 13px; gap: 5px; }
  .tools .tabs button.on { box-shadow: none; }
  .tools .tabs button[data-f]:not([data-f="all"])::before { width: 6px; height: 6px; }
  #rtabs button { padding: 0 8px; }
  #rtabs button[data-r].on::after { left: 8px; right: 8px; bottom: 1px; }
  #rtabs .sbtn { margin-right: 4px; }

  /* 제목 인라인 수정 */
  .hrow > div:first-child { min-width: 0; flex: 1; }
  input[type=text].titleInput {
    display: block; width: 100%; max-width: 320px; margin: 0; padding: 0 0 2px; border: 0; border-bottom: 2px solid var(--ink);
    border-radius: 0; background: transparent; color: var(--ink); outline: none;
    font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2;
  }

  /* ===== 별점 반 개 ===== */
  .stars .half, .rate button.half {
    background: linear-gradient(90deg, var(--star) 50%, var(--line2) 50%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    font-style: normal; font-weight: inherit;
  }
  .rate { align-items: center; }
  .rate .rval { margin-left: 8px; font-size: 15px; font-weight: 700; color: var(--sub); min-width: 28px; }

  /* ===== 필터 줄: 돋보기(원형 버튼) + 글자형 선택 3개, 한 줄 높이 26px ===== */
  #rtabs { display: flex; align-items: center; gap: 14px; margin: 0; }
  #rtabs .sbtn { margin: 0 -2px 0 0; }
  #rtabs .fsel {
    position: relative; flex: none; display: inline-flex; align-items: center; margin: 0;
    padding: 0 13px 0 0; border: 0; background: transparent; color: var(--mute);
    font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer;
  }
  #rtabs .fsel::after {
    content: ""; position: absolute; right: 2px; top: 50%; width: 5px; height: 5px;
    border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: translateY(-70%) rotate(45deg);
  }
  #rtabs .fsel select {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px;
    padding: 0; margin: 0; border: 0; border-radius: 0; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  #rtabs .fsel.act { color: var(--ink); font-weight: 700; }
  /* 생각 포함: 켜고 끄는 토글 버튼, 오른쪽 끝 정렬 */
  #rtabs button.tgl {
    margin: 0 0 0 auto; flex: none; padding: 0; border: 0; border-radius: 0; background: transparent;
    color: var(--mute); font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  }
  #rtabs button.tgl::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor;
  }
  #rtabs button.tgl.on { color: var(--ink); font-weight: 700; }   /* 켜지면 생각 색(남보라) */
  #rtabs button.tgl.on::before { background: #5b6dd6; box-shadow: none; }
  #rtabs button.tgl::after { display: none; }
  /* PDF 저장: 생각 포함 오른쪽, 모서리가 작게 둥근 사각형 */
  #rtabs button.pdfb {
    flex: none; margin: 0 0 0 auto; height: var(--ctl); padding: 0 10px; border: 1px solid var(--line2);
    border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 500;
    white-space: nowrap; display: inline-flex; align-items: center; cursor: pointer;
  }
  #rtabs button.pdfb[hidden] { display: none; }
  #rtabs button.tgl:not([hidden]) ~ button.pdfb { margin-left: -4px; }   /* 숨은 토글이 사이에 끼어도(전체 탭의 아무말 포함, 생각 탭의 생각 포함) 같은 간격 */   /* 생각 포함이 있을 땐 바로 옆, 없을 땐(생각 탭 등) 오른쪽 끝 */
  #rtabs button.pdfb.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }

  /* ===== 타임라인(생각) ===== */
  #tlWrap { padding: 12px 16px 4px; }
  .tlcompose { background: var(--paper); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 4px 14px rgba(25,28,43,.04); padding: 12px 14px 10px; }
  .tlcompose textarea {
    display: block; border: 0; padding: 0; min-height: 56px; max-height: 240px; font-size: 16px; line-height: 1.6;
    resize: none; background: transparent; border-radius: 0; outline: none;
  }
  .tlcompose .cb { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .tlcompose .cb span { font-size: 12px; color: var(--mute); }
  .tlcompose .cb button {
    border: 0; background: var(--ink); color: #fff; border-radius: 999px;
    cursor: pointer;
  }
  .tlcompose .cb button:disabled { opacity: .3; cursor: default; }
  .rows .tent { padding: 10px 14px; position: relative; }
  .rows .tent + .tent, .rows .tent + .card, .rows .card + .tent { border-top: 1px solid var(--line); }
  /* 일기 카드 밑에 이어 붙는 그날 아무말: 카드 띠가 끊기지 않고 아래까지 이어짐 */
  .rows .card.chained .bar { bottom: 0; border-radius: 2px 2px 0 0; }
  .rows .tent.chain { padding-left: 20px; border-top: 0; padding-top: 8px; }
  .rows .tent.chain::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 3px; background: var(--think); }
  /* 일기 본문과 아무말 사이 점선: 다른 카드의 덧붙임 구분선과 같은 굵기·색·간격(위 12 / 아래 10) */
  .rows .tent.chain.chainfirst::after { content: ""; position: absolute; left: 20px; right: 14px; top: -2px; border-top: 1px dashed var(--line2); }
  .rows .tent.chain.chainlast::before { bottom: 11px; border-radius: 0 0 2px 2px; }
  .tent .th { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mute); min-height: 20px; }
  .tent .th .tm { flex: 1; min-width: 0; }
  .tent .th .tag { flex: none; border: 1px solid var(--line2); border-radius: 5px; padding: 0 5px; font-size: 11px; color: var(--sub); line-height: 16px; }
  .tent .th button { border: 0; background: none; color: var(--mute); font-size: 12px; padding: 2px 3px; cursor: pointer; }
  .tent .tlink {
    display: block; width: 100%; text-align: left; border: 0; background: none; padding: 2px 0 0; cursor: pointer;
    font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tent .tlink b { color: var(--ct, var(--c)); font-weight: 700; }
  .tent .tx { font-size: 15px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
  .tent.lt .tx { color: #3c4157; }
  /* 목록의 생각 줄: 카드처럼 왼쪽에 생각 색(#5b6dd6) 띠, 접힌 상태는 한 줄 미리보기 */
  .rows .tent.lst { padding-left: 20px; cursor: pointer; }
  .tent.lst::before { content: ""; position: absolute; left: 9px; top: 11px; bottom: 11px; width: 3px; border-radius: 2px; background: #5b6dd6; }
  .tent.lst .th .tag { border-color: #5b6dd6; color: #5b6dd6; }
  .tent.lst:not(.open) .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tent.lst:focus-visible { outline-offset: -3px; }
  .tent.lst .tx .more { color: var(--mute); opacity: .7; }
  .rows .tent.lg { display: flex; align-items: center; gap: 8px; padding: 8px 14px; }
  .tent.lg::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--line2)); }
  .tent.lg .tm { flex: none; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .tent.lg .lgt { flex: 1; min-width: 0; margin: 0; padding: 0; border: 0; background: none; text-align: left; font: inherit; font-size: 13.5px; line-height: 1.5; color: var(--sub); overflow-wrap: anywhere; }
  .tent.lg button.lgt { cursor: pointer; }
  .tent.lg .lgd { flex: none; border: 0; background: none; color: var(--mute); font-size: 12px; padding: 2px 3px; cursor: pointer; font-family: inherit; }
  /* 타임라인: 시간 | 점(레일) | 내용 */
  .rows.tlrows .tent.tl { display: grid; grid-template-columns: 9px 1fr; column-gap: 10px; align-items: start; padding: 10px 14px; }
  .rows.tlrows .tent.tl + .tent.tl { border-top: 0; }
  .tent.tl::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 1px; background: var(--line2); }
  .tent.tl:first-child::before { top: 20px; }
  .tent.tl:last-child::before { bottom: calc(100% - 20px); }
  .tent.tl:only-child::before { display: none; }
  .tent.tl .tm { flex: none; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tent.tl .dot { position: relative; z-index: 1; width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; box-sizing: border-box; background: var(--cd); box-shadow: 0 0 0 3px var(--paper); }
  .tent.tl[data-k="t"] { --cd: #5b6dd6; --cc: #5b6dd6; }
  .tent.tl[data-k="l"] { --cd: var(--c, var(--sub)); --cc: var(--ct, var(--sub)); }
  .tent.tl[data-k="a"] { --cd: var(--paper); --cc: var(--sub); }
  .tent.tl[data-k="a"] .dot { border: 2px solid var(--c, var(--mute)); }
  .tent.tl .bd { min-width: 0; }
  .tent.tl .hd { display: flex; align-items: center; gap: 6px; min-height: 20px; }
  .tent.tl .chip { flex: none; font-size: 11px; font-weight: 600; line-height: 17px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--cc); color: var(--cc); background: var(--paper); }
  .tent.tl[data-k="a"] .chip { border-color: var(--line2); color: var(--mute); font-weight: 500; }
  /* 관람·완독 태그는 카테고리 색, 동그라미도 같은 색으로 채움 (기록 추가·후기·기록 줄은 속이 빈 원) */
  .tent.tl[data-k="a"][data-ck="관람"] .chip, .tent.tl[data-k="a"][data-ck="완독"] .chip, .tent.tl[data-k="a"][data-ck="일기"] .chip, .tent.tl[data-k="a"][data-ck="생각타래"] .chip { border-color: var(--ct, var(--sub)); color: var(--ct, var(--sub)); font-weight: 600; }
  .tent.tl[data-k="a"][data-ck="관람"] .dot, .tent.tl[data-k="a"][data-ck="완독"] .dot, .tent.tl[data-k="a"][data-ck="일기"] .dot, .tent.tl[data-k="a"][data-ck="생각타래"] .dot { background: var(--c, var(--sub)); border-color: var(--c, var(--sub)); }
  .tent.tl .sp { flex: 1; }
  .tent.tl .lgt { flex: 1; min-width: 0; margin: 0; padding: 0; border: 0; background: none; text-align: left; font: inherit; font-size: 13.5px; line-height: 1.5; color: var(--sub); overflow-wrap: anywhere; }
  .tent.tl button.lgt { cursor: pointer; }
  .tent.tl .act { flex: none; border: 0; background: none; color: var(--mute); font-size: 12px; padding: 2px 3px; cursor: pointer; font-family: inherit; }
  .tent.tl .tlink { padding: 4px 0 0; font-size: 13px; font-family: inherit; }
  .tent.tl .tx { margin-top: 4px; }
  .tent .edit textarea { min-height: 80px; font-size: 15px; padding: 9px 11px; margin-top: 4px; }
  .tent .edit .cb { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  .tent .edit .cb button { border: 1px solid var(--line2); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--ink); }
  .tent .edit .cb button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .moreTl { display: block; margin: 14px auto 6px; border: 1px solid var(--line2); background: var(--paper); border-radius: 999px; cursor: pointer; color: var(--ink); }
  .dots i.td { background: transparent; box-shadow: inset 0 0 0 1.5px #9aa0b6; }
  .dots i.rd, .calcard .day.sel .dots i.rd { background: transparent; box-shadow: inset 0 0 0 1.5px var(--book); }   /* 독서함: 노란 빈 동그라미 */
  .calcard .day.sel .dots i.td { box-shadow: inset 0 0 0 1.5px #9aa0b6; }
  .dayh2 .dwbtn { margin: 0 0 0 auto; border: 0; background: none; padding: 2px 4px; font: inherit; font-size: 13px; font-weight: 600; color: #5b6dd6; cursor: pointer; }
  #dayTh .tlcompose { margin-bottom: 8px; }

  .tent.tl[data-th="1"] .dot { border-color: #5b6dd6; }
  .tent.tl[data-old="1"] .dot { background: var(--paper); border: 2px solid var(--c, var(--mute)); }
  .tent.tl .tm.later { border: 0; background: none; margin: 0; padding: 2px 3px; font-family: inherit; line-height: normal; cursor: pointer; text-decoration: none; }
  .tent.flash { animation: tflash 1.6s ease-out; }

  .dayh2 { margin: 18px 4px 8px; font-size: 14px; font-weight: 700; color: var(--sub); display: flex; gap: 6px; align-items: baseline; }
  .dayh2 .n { font-weight: 500; color: var(--mute); }

  /* ===== 입력 화면: 홈과 같은 카드·알약 버튼 언어 ===== */

    flex: 1; min-width: 0; border-radius: 999px;
